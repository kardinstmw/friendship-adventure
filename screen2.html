<head>

  <style>
    :root { --cream:#f4efe6; --ink:#2e2a24; --soft:#6b6255; --line:#d4d0c7; --pink:#f4a8b7; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:var(--cream); font-family:'Poiret One',sans-serif; font-weight:600; }
    button, input { font:inherit; }
    .page { width:100%; max-width:420px; min-height:100vh; margin:auto; overflow:hidden; position:relative; }
    .banner { width:100%; display:block; }
    .intro { padding:58px 24px 18px; position:relative; min-height:230px; }
    h1, h2, p { margin:0; }
    h1 { max-width:225px; font-size:2rem; line-height:1.08; font-weight:400; }
    .intro-note { width:125px; margin:12px 0 0; color:var(--soft); font-size:.93rem; line-height:1.2; }
    .guide { position:absolute; right:18px; bottom:-4px; width:128px; text-align:center; line-height:.8; transform:rotate(-5deg); }
    .guide img { display:block; width:200px; height:auto; margin:0 auto; }
    .guide span { display:block; margin-top:14px; padding:8px; border:2px solid var(--ink); border-radius:8px; background:#fffdf7; font-size:.67rem; line-height:1.1; transform:rotate(7deg); }
    .map { position:relative; min-height:890px; padding:75px 0 30px; }
    .route { position:absolute; left:50%; top:20px; height:785px; transform:translateX(-50%); z-index:0; }
    .memory { position:absolute; z-index:1; width:84px; height:84px; padding:4px; border:0; border-radius:50%; background:var(--cream); cursor:pointer; box-shadow:0 0 0 1px rgba(46,42,24,.13); transition:transform .2s ease, box-shadow .2s ease; }
    .memory:hover, .memory:focus-visible { transform:scale(1.08); box-shadow:0 5px 16px rgba(46,42,24,.22); outline:none; }
    .memory img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
    .memory.one { top:58px; left:calc(50% - 28px); }
    .memory.two { top:285px; left:calc(50% - 76px); }
    .memory.three { top:525px; left:calc(50% - 42px); }
    .memory.four { top:665px; left:calc(50% - 105px); }
    .side-character { position:absolute; z-index:2; width:96px; height:auto; filter:drop-shadow(0 4px 0 rgba(46,42,24,.14)); user-select:none; }
    .side-character.left-top { top:110px; left:-25px; transform:rotate(-18deg); }
    .side-character.right-top { top:160px; right:-25px; transform:rotate(16deg); }
    .side-character.left-bottom { top:480px; left:-22px; transform:rotate(12deg); }
    .side-character.right-bottom { top:500px; right:-23px; transform:rotate(-10deg); }
    .tap-hint { position:absolute; bottom:4px; left:50%; transform:translateX(-50%); color:var(--soft); font-size:.75rem; white-space:nowrap; }
    .invite { padding:4px 16px 60px; text-align:center; }
    h2 { font-size:1.75rem; font-weight:400; }
    .subtitle { margin:7px 0 22px; color:var(--soft); font-size:.92rem; font-style:italic; }
    form { text-align:left; }
    .date-label { display:block; margin:0 0 8px; text-align:center; font-size:1rem; }
    input[type="date"] { width:100%; min-height:58px; padding:12px 14px; border:1px solid var(--line); border-radius:6px; background:#fffdf9; color:var(--ink); font-size:1rem; }
    .choice-title { margin:29px 0 13px; text-align:center; font-size:1rem; }
    .choices { display:flex; flex-wrap:wrap; justify-content:center; gap:10px 12px; }
    .choice input { position:absolute; opacity:0; }
    .choice span { display:block; min-width:76px; padding:8px 12px; border:1px solid var(--line); border-radius:999px; text-align:center; font-size:.85rem; cursor:pointer; transition:background .2s, border-color .2s, transform .2s; }
    .choice input:checked + span { border-color:var(--ink); background:var(--pink); transform:translateY(-2px); }
    .submit { display:block; width:170px; margin:46px auto 0; padding:13px 20px; border:1px solid var(--ink); border-radius:999px; background:transparent; color:var(--ink); cursor:pointer; font-size:1rem; transition:background .2s,color .2s,transform .2s; }
    .submit:hover { background:var(--ink); color:var(--cream); transform:translateY(-2px); }
    .mail-note { margin-top:12px; color:var(--soft); text-align:center; font-size:.66rem; line-height:1.3; }
    .modal { display:none; position:fixed; inset:0; z-index:10; padding:20px; align-items:center; justify-content:center; background:rgba(46,42,24,.68); }
    .modal.open { display:flex; }
    .modal-card { width:min(100%, 380px); max-height:90vh; overflow:auto; position:relative; padding:14px 14px 22px; border-radius:12px; background:var(--cream); text-align:center; }
    .modal-image { display:block; width:100%; max-height:58vh; border-radius:7px; object-fit:contain; background:#dedede; }
    .modal-text { margin:15px 12px 0; font-size:1.05rem; line-height:1.35; white-space:pre-line; }
    .close { position:absolute; top:20px; right:20px; width:34px; height:34px; border:1px solid var(--ink); border-radius:50%; background:var(--cream); color:var(--ink); cursor:pointer; font-size:1.3rem; }
  </style>
</head>

  </main>

  <div class="modal" id="memoryModal" role="dialog" aria-modal="true" aria-labelledby="modalText">
    <div class="modal-card">
      <button class="close" type="button" aria-label="Закрыть">×</button>
      <img class="modal-image" id="modalImage" src="" alt="">
      <p class="modal-text" id="modalText"></p>
    </div>
  </div>

  <audio id="bgMusic" loop preload="auto">
    <source src="smeshariki_08.mp3" type="audio/mpeg">
  </audio>

  <script>
    /* =========================
       МУЗЫКА
    ========================= */

    const music = document.getElementById('bgMusic');

    const startMusic = () => {
      music.play().catch(() => {});
    };

    window.addEventListener('load', startMusic);
    document.addEventListener('pointerdown', startMusic, { once:true });


    /* =========================
       ОКНО ВОСПОМИНАНИЙ
    ========================= */

    const modal = document.getElementById('memoryModal');
    const modalImage = document.getElementById('modalImage');
    const modalText = document.getElementById('modalText');

    document.querySelectorAll('.memory').forEach((memory) => {

      memory.addEventListener('click', () => {

        modalImage.src = memory.dataset.image;
        modalImage.alt = memory.querySelector('img').alt;
        modalText.textContent = memory.dataset.text;

        modal.classList.add('open');

      });

    });

    const closeModal = () => {
      modal.classList.remove('open');
    };

    document.querySelector('.close').addEventListener('click', closeModal);

    modal.addEventListener('click', (event) => {
      if (event.target === modal) {
        closeModal();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeModal();
      }
    });


    /* =========================
       SMS
    ========================= */

    const inviteForm = document.getElementById('inviteForm');

    inviteForm.addEventListener('submit', (event) => {

      event.preventDefault();

      const dateInput = document.getElementById('date');

      const selectedActivities = Array.from(
        document.querySelectorAll('input[name="activity"]:checked')
      ).map((input) => input.value);

      /* Преобразуем дату из YYYY-MM-DD в DD.MM.YYYY */

      let formattedDate = 'Не выбрана';

      if (dateInput.value) {

        const [year, month, day] = dateInput.value.split('-');

        formattedDate = `${day}.${month}.${year}`;

      }

      /* Формируем текст SMS */

      const message =
`🗺 Карта приключений

📅 Дата: ${formattedDate}

❤️ Предпочтения:
${selectedActivities.length > 0
  ? selectedActivities.join(', ')
  : 'Не выбраны'}`;

      /* Открываем SMS */

      const smsUrl =
        `sms:+37258046504?body=${encodeURIComponent(message)}`;

      window.location.href = smsUrl;

    });

  </script>
