<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Карта приключений</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream: #f4efe6;
            --ink: #2e2a24;
            --soft: #6b6255;
            --line: #d4d0c7;
            --pink: #f4a8b7;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--cream);
            color: var(--ink);
            font-family: "Poiret One", cursive;
            overflow-x: hidden;
        }

        img {
            max-width: 100%;
            display: block;
        }

        button,
        input {
            font-family: inherit;
        }

        /* =========================
           BANNER
        ========================= */

        .banner {
            width: 100%;
            height: auto;
        }

        .banner img {
            width: 100%;
            height: auto;
        }

        /* =========================
           INTRO
        ========================= */

        .intro {
            text-align: center;
            padding: 70px 20px 45px;
        }

        .intro h1 {
            margin: 0 0 15px;
            font-size: clamp(34px, 6vw, 64px);
            font-weight: 400;
        }

        .intro p {
            margin: 0 auto;
            max-width: 700px;
            font-size: clamp(18px, 2.5vw, 24px);
            line-height: 1.5;
            color: var(--soft);
        }

        /* =========================
           MAP
        ========================= */

        .map-wrapper {
            position: relative;
            width: min(1100px, 94%);
            margin: 0 auto;
            padding: 20px 0 80px;
        }

        .map {
            position: relative;
            width: 100%;
            min-height: 700px;
        }

        .route {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 75%;
            transform: translate(-50%, -50%);
            opacity: 0.7;
            pointer-events: none;
        }

        /* =========================
           GUIDE CHARACTER
        ========================= */

        .guide {
            position: absolute;
            width: 150px;
            left: 50%;
            top: 30px;
            transform: translateX(-50%);
            z-index: 3;
        }

        /* =========================
           SIDE CHARACTERS
        ========================= */

        .character {
            position: absolute;
            z-index: 2;
            pointer-events: none;
        }

        .character-1 {
            width: 110px;
            left: 2%;
            top: 180px;
        }

        .character-2 {
            width: 120px;
            right: 1%;
            top: 120px;
        }

        .character-3 {
            width: 120px;
            left: 3%;
            bottom: 120px;
        }

        .character-4 {
            width: 120px;
            right: 3%;
            bottom: 60px;
        }

        /* =========================
           MEMORY CARDS
        ========================= */

        .memory {
            position: absolute;
            width: 190px;
            height: 190px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            border: 5px solid var(--cream);
            box-shadow: 0 10px 30px rgba(46, 42, 36, 0.18);
            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
            z-index: 5;
            background: #ddd;
        }

        .memory:hover {
            transform: scale(1.08);
            box-shadow: 0 15px 40px rgba(46, 42, 36, 0.28);
        }

        .memory img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .memory-1 {
            top: 170px;
            left: 16%;
        }

        .memory-2 {
            top: 190px;
            right: 15%;
        }

        .memory-3 {
            bottom: 140px;
            left: 18%;
        }

        .memory-4 {
            bottom: 100px;
            right: 17%;
        }

        /* =========================
           MEMORY NUMBER
        ========================= */

        .memory-number {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--pink);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            z-index: 2;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(46, 42, 36, 0.72);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            width: min(850px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: var(--cream);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.3);
        }

        .modal-close {
            position: absolute;
            right: 15px;
            top: 12px;
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: rgba(244, 168, 183, 0.95);
            color: var(--ink);
            font-size: 28px;
            cursor: pointer;
            z-index: 10;
        }

        .modal-media {
            width: 100%;
            max-height: 60vh;
            object-fit: contain;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        video.modal-media {
            background: #000;
        }

        .modal-title {
            margin: 0 0 12px;
            font-size: 32px;
            font-weight: 400;
        }

        .modal-text {
            margin: 0;
            font-size: 20px;
            line-height: 1.6;
            color: var(--soft);
            white-space: pre-line;
        }

        /* =========================
           FORM SECTION
        ========================= */

        .invite-section {
            width: min(850px, 92%);
            margin: 0 auto;
            padding: 70px 0 100px;
            text-align: center;
        }

        .invite-section h2 {
            margin: 0 0 10px;
            font-size: clamp(34px, 5vw, 54px);
            font-weight: 400;
        }

        .invite-section .subtitle {
            margin: 0 0 40px;
            font-size: 22px;
            color: var(--soft);
        }

        #inviteForm {
            text-align: left;
            background: rgba(255, 255, 255, 0.35);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 30px;
        }

        .form-group {
            margin-bottom: 28px;
        }

        .form-label {
            display: block;
            margin-bottom: 12px;
            font-size: 21px;
        }

        input[type="date"] {
            width: 100%;
            padding: 15px 18px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.65);
            color: var(--ink);
            font-size: 18px;
            outline: none;
        }

        input[type="date"]:focus {
            border-color: var(--pink);
        }

        .activities {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .activity {
            position: relative;
        }

        .activity input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .activity label {
            display: block;
            padding: 15px;
            border: 1px solid var(--line);
            border-radius: 12px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.45);
            font-size: 18px;
            text-align: center;
            transition: all 0.25s ease;
        }

        .activity label:hover {
            border-color: var(--pink);
        }

        .activity input:checked + label {
            background: var(--pink);
            border-color: var(--pink);
        }

        .submit-button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 17px 25px;
            background: var(--ink);
            color: var(--cream);
            font-size: 21px;
            cursor: pointer;
            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        .form-message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 18px;
        }

        .form-message.show {
            display: block;
        }

        .form-message.error {
            background: #f5d5d5;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            text-align: center;
            padding: 30px 20px 50px;
            color: var(--soft);
            font-size: 16px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .intro {
                padding-top: 45px;
            }

            .map {
                min-height: 650px;
            }

            .guide {
                width: 110px;
                top: 10px;
            }

            .route {
                width: 95%;
            }

            .memory {
                width: 145px;
                height: 145px;
            }

            .memory-1 {
                left: 2%;
                top: 150px;
            }

            .memory-2 {
                right: 2%;
                top: 170px;
            }

            .memory-3 {
                left: 2%;
                bottom: 120px;
            }

            .memory-4 {
                right: 2%;
                bottom: 80px;
            }

            .character-1 {
                width: 75px;
                left: 0;
                top: 310px;
            }

            .character-2 {
                width: 75px;
                right: 0;
                top: 320px;
            }

            .character-3 {
                width: 80px;
                left: 0;
                bottom: 15px;
            }

            .character-4 {
                width: 80px;
                right: 0;
                bottom: 10px;
            }

            .modal-content {
                padding: 18px;
                border-radius: 18px;
            }

            .modal-title {
                font-size: 27px;
            }

            .modal-text {
                font-size: 17px;
            }

            .activities {
                grid-template-columns: 1fr;
            }

            #inviteForm {
                padding: 20px;
            }
        }
    </style>
</head>

    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        /* =====================================
           MEMORY MODALS
        ===================================== */

        const memories = document.querySelectorAll(".memory");

        const modal = document.getElementById("memoryModal");
        const modalClose = document.getElementById("modalClose");

        const modalTitle = document.getElementById("modalTitle");
        const modalText = document.getElementById("modalText");

        const modalMediaContainer =
            document.getElementById("modalMediaContainer");


        memories.forEach(memory => {

            memory.addEventListener("click", () => {

                const title =
                    memory.dataset.title;

                const image =
                    memory.dataset.image;

                const text =
                    memory.dataset.text;


                modalTitle.textContent = title;
                modalText.textContent = text;


                modalMediaContainer.innerHTML = "";


                /*
                    Если это MP4 —
                    создаём video.
                */

                if (
                    image.toLowerCase().endsWith(".mp4") ||
                    image.toLowerCase().endsWith(".webm") ||
                    image.toLowerCase().endsWith(".mov")
                ) {

                    const video =
                        document.createElement("video");

                    video.className = "modal-media";

                    video.controls = true;

                    video.autoplay = true;

                    video.playsInline = true;

                    video.src = image;

                    modalMediaContainer.appendChild(video);

                } else {

                    const img =
                        document.createElement("img");

                    img.className = "modal-media";

                    img.src = image;

                    img.alt = title;

                    modalMediaContainer.appendChild(img);

                }


                modal.classList.add("active");

                document.body.style.overflow = "hidden";

            });

        });


        /* =====================================
           CLOSE MODAL
        ===================================== */

        function closeModal() {

            modal.classList.remove("active");

            document.body.style.overflow = "";

            /*
                Останавливаем видео,
                когда закрываем окно.
            */

            const video =
                modalMediaContainer.querySelector("video");

            if (video) {

                video.pause();

                video.src = "";

            }

            modalMediaContainer.innerHTML = "";

        }


        modalClose.addEventListener(
            "click",
            closeModal
        );


        modal.addEventListener(
            "click",
            event => {

                if (event.target === modal) {

                    closeModal();

                }

            }
        );


        document.addEventListener(
            "keydown",
            event => {

                if (event.key === "Escape") {

                    closeModal();

                }

            }
        );


        /* =====================================
           BACKGROUND MUSIC
        ===================================== */

        const music =
            document.getElementById("backgroundMusic");


        /*
            Браузеры запрещают автоматический
            запуск музыки до взаимодействия
            пользователя со страницей.

            Поэтому пробуем включить музыку
            после первого клика.
        */

        let musicStarted = false;


        document.addEventListener(
            "click",
            () => {

                if (!musicStarted) {

                    music.volume = 0.35;

                    music.play()
                        .then(() => {

                            musicStarted = true;

                        })
                        .catch(() => {

                            /*
                                Safari / iOS может
                                дополнительно заблокировать
                                autoplay.
                            */

                        });

                }

            },
            { once: false }
        );


        /* =====================================
           FORM SUBMISSION
        ===================================== */

        const form =
            document.getElementById("inviteForm");

        const submitButton =
            document.getElementById("submitButton");

        const formMessage =
            document.getElementById("formMessage");


        form.addEventListener(
            "submit",
            async function(event) {

                /*
                    ОЧЕНЬ ВАЖНО:
                    отменяем обычный submit.

                    Поэтому Safari больше не будет
                    открывать страницу formsubmit.co.
                */

                event.preventDefault();


                formMessage.className =
                    "form-message";

                formMessage.textContent = "";


                /*
                    Получаем дату.
                */

                const date =
                    document.getElementById("date").value;


                /*
                    Получаем выбранные активности.
                */

                const activities =
                    Array.from(
                        document.querySelectorAll(
                            'input[name="activity"]:checked'
                        )
                    ).map(
                        checkbox => checkbox.value
                    );


                /*
                    Проверяем активности.
                */

                if (activities.length === 0) {

                    formMessage.textContent =
                        "Выбери хотя бы один вариант ❤️";

                    formMessage.classList.add(
                        "show",
                        "error"
                    );

                    return;

                }


                /*
                    Блокируем кнопку,
                    чтобы случайно не отправить
                    форму несколько раз.
                */

                submitButton.disabled = true;

                submitButton.textContent =
                    "Отправляем...";


                /*
                    Данные для FormSubmit.
                */

                const data = {

                    _subject:
                        "Приглашение — полгода дружбы",

                    _template:
                        "table",

                    date:
                        date,

                    activity:
                        activities.join(", ")

                };


                try {

                    /*
                        AJAX endpoint FormSubmit.

                        Благодаря /ajax/
                        браузер не переходит
                        на страницу FormSubmit.
                    */

                    const response =
                        await fetch(
                            "https://formsubmit.io/ajax/kardin.stmw@gmail.com",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json",

                                    "Accept":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(data)
                            }
                        );


                    /*
                        Получаем JSON ответ.
                    */

                    const result =
                        await response.json();


                    console.log(
                        "FormSubmit response:",
                        result
                    );


                    /*
                        Проверяем HTTP статус.
                    */

                    if (!response.ok) {

                        throw new Error(
                            "Ошибка сервера"
                        );

                    }


                    /*
                        FormSubmit может вернуть
                        success как boolean или строку.
                    */

                    if (
                        result.success === false ||
                        result.success === "false"
                    ) {

                        throw new Error(
                            result.message ||
                            "FormSubmit не принял форму"
                        );

                    }


                    /*
                        Успешно!

                        Переходим на нашу страницу
                        success.html.
                    */

                    window.location.href =
                        "success.html";


                } catch (error) {

                    console.error(
                        "Form error:",
                        error
                    );


                    /*
                        Показываем ошибку
                        пользователю.
                    */

                    formMessage.textContent =
                        "Не получилось отправить заявку. Попробуй ещё раз ❤️";


                    formMessage.classList.add(
                        "show",
                        "error"
                    );


                    /*
                        Возвращаем кнопку.
                    */

                    submitButton.disabled = false;

                    submitButton.textContent =
                        "Отправить";

                }

            }
        );

    </script>

</body>
</html>
